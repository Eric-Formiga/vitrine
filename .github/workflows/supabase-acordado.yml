# Mantém o projeto do Supabase acordado (docs/ARCHITECTURE.md, seção 10). No plano grátis,
# o projeto é pausado depois de 7 dias sem uso, e a demo cairia. A cada 3 dias, este job
# consulta o bucket de imagens pela API do Storage, que lê o banco do projeto. Se a chamada
# falhar, o job falha e o GitHub avisa por e-mail.
#
# Secrets do repositório: SUPABASE_URL e SUPABASE_SECRET_KEY (os mesmos valores do .env).
# Trocou a chave no Supabase? Atualize o secret também.
#
# O GitHub desliga os agendamentos de um repositório público que fica 60 dias sem
# atividade. Como os commits podem ficar espaçados, o segundo passo reativa o próprio
# workflow pela API a cada execução, o que zera essa contagem sem precisar de commit.
name: Supabase acordado

on:
  schedule:
    - cron: '17 9 */3 * *'
  workflow_dispatch:

# Só o necessário para reativar o próprio agendamento; nada de leitura ou escrita de código.
permissions:
  actions: write

jobs:
  consultar-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consulta o bucket de imagens
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          BUCKET: product-images
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error::Faltam os secrets SUPABASE_URL e SUPABASE_SECRET_KEY."
            exit 1
          fi
          status=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 10 --max-time 30 \
            -H "apikey: $SUPABASE_SECRET_KEY" \
            -H "authorization: Bearer $SUPABASE_SECRET_KEY" \
            "${SUPABASE_URL%/}/storage/v1/bucket/$BUCKET")
          echo "Storage respondeu $status"
          if [ "$status" != "200" ]; then
            echo "::error::O Storage respondeu $status. Confira os secrets e se o projeto está pausado no painel do Supabase."
            exit 1
          fi

      - name: Renova o agendamento (sem precisar de commit)
        # Roda mesmo se a consulta falhar: o agendamento não pode morrer junto.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT "repos/${{ github.repository }}/actions/workflows/supabase-acordado.yml/enable"
          echo "Agendamento renovado: a contagem de 60 dias recomeça agora."
